<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">

<style>
  html,body{margin:0;height:100%;background:#0b0c14;overflow:hidden;font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR",sans-serif;color:#e8eaf2}
  #wrap{position:absolute;width:960px;height:600px;transform-origin:top left;background:#000}
  canvas{display:block;width:960px;height:600px}
  .ov{position:absolute;left:0;top:0;width:960px;height:600px;display:none}
  button{font-family:inherit;cursor:pointer;border:0;border-radius:6px;color:#fff;font-weight:bold}
  button:disabled{background:#5a5a64!important;cursor:default;opacity:.8}
  #title{pointer-events:none}
  #title .box{position:absolute;bottom:34px;left:0;width:100%;text-align:center;pointer-events:auto}
  #title label{font-size:18px;font-weight:bold;margin-right:8px}
  #nick{font-size:18px;font-weight:bold;text-align:center;width:170px;padding:7px;border-radius:6px;border:2px solid #667;font-family:inherit}
  #startBtn{background:#e65028;font-size:20px;width:140px;height:44px;margin-left:10px}
  #hint{font-size:14px;color:#c8c8dc;margin-top:8px}
  #delBtn{margin-top:10px;background:#6a3a46;font-size:13px;width:200px;height:32px}
  html,body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #mob{position:absolute;left:0;top:0;width:960px;height:600px;z-index:40;pointer-events:none;display:none}
  #mob button,#joy{pointer-events:auto;touch-action:none;position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.45);background:rgba(30,34,60,.55);color:#fff;font-weight:bold;font-size:15px;line-height:1.15;padding:0;box-shadow:0 0 8px rgba(0,0,0,.5)}
  #mob button:active,#mob button.on{background:rgba(255,255,255,.4)}
  #joy{left:36px;bottom:60px;width:150px;height:150px;background:rgba(255,255,255,.1)}
  #knob{position:absolute;left:43px;top:43px;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.4);border:2px solid rgba(255,255,255,.7);pointer-events:none}
  #mAtk{right:36px;bottom:56px;width:116px;height:116px;background:rgba(200,50,60,.55)!important;font-size:22px}
  #mE{right:172px;bottom:52px;width:76px;height:76px}
  #mR{right:152px;bottom:140px;width:70px;height:70px}
  #mF{right:62px;bottom:182px;width:66px;height:66px}
  #mQ{right:236px;bottom:150px;width:58px;height:58px;font-size:13px}
  #mrow{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);display:flex;gap:8px;pointer-events:none}
  #mrow button{position:static;width:54px;height:44px;border-radius:10px;font-size:12px}
  #rot{position:fixed;left:0;top:0;width:100%;height:100%;background:#0b0c14;color:#fff;z-index:999;display:none;align-items:center;justify-content:center;font-size:20px;text-align:center}
  #codeBtn{position:absolute;right:178px;bottom:8px;z-index:50;height:28px;padding:0 10px;background:#3c3c50;font-size:12px;opacity:.85}
  #codeModal{background:rgba(0,0,0,.75);z-index:61}
  #codeBox{position:absolute;left:300px;top:170px;width:360px;background:#14162a;border:2px solid #6a6aa0;border-radius:10px;padding:18px;box-sizing:border-box;color:#eee}
  #codeIn{width:100%;box-sizing:border-box;padding:8px;font-size:16px;margin:8px 0;background:#10101a;color:#fff;border:1px solid #666;border-radius:6px}
  #bakBtn{position:absolute;right:8px;bottom:8px;z-index:50;height:28px;padding:0 10px;background:#3c3c50;font-size:12px;opacity:.85}
  #bakModal{background:rgba(0,0,0,.75);z-index:60}
  #bakBox{position:absolute;left:130px;top:70px;width:700px;height:460px;background:#14162a;border:2px solid #6a6aa0;border-radius:10px;padding:16px;box-sizing:border-box}
  #bakBox h3{margin:0 0 6px;font-size:18px}
  #bakBox p{margin:4px 0;font-size:13px;color:#c8c8dc;line-height:1.45}
  #bakText{width:100%;height:150px;box-sizing:border-box;background:#0b0c14;color:#9fe;border:1px solid #556;border-radius:6px;font-size:11px;word-break:break-all;resize:none}
  #bakBox button{height:34px;padding:0 12px;margin:6px 6px 0 0;background:#3c5aa0;font-size:13px}
  #bakMsg{margin-top:8px;font-size:14px;color:#ffd75a;min-height:20px}
  #skipStory{position:absolute;right:20px;top:14px;width:160px;height:38px;background:#3c3c50;font-size:14px;display:none}
  #town{background:#181b28;padding:10px 12px;box-sizing:border-box}
  #ttop{font-size:16px;font-weight:bold;height:28px}
  #tabs{display:flex;gap:4px}
  #tabs button{background:#2c3250;font-size:15px;padding:8px 22px;border-radius:6px 6px 0 0}
  #tabs button.on{background:#4a5aa0}
  #tbody{position:absolute;left:12px;right:12px;top:78px;bottom:64px;background:#202436;overflow-y:auto;padding:8px 10px;box-sizing:border-box}
  #tbot{position:absolute;left:12px;right:12px;bottom:8px;height:48px;display:flex;align-items:center;gap:10px}
  #tmsg{flex:1;font-size:14px;font-weight:bold;color:#96ffc8}
  #goBtn{background:#dc5028;font-size:18px;width:250px;height:46px}
  #exitBtn{background:#555a78;font-size:16px;width:150px;height:46px}
  .bet{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 6px}
  .bet input{width:90px;font-size:16px;font-weight:bold;padding:5px;border-radius:6px;border:2px solid #667;font-family:inherit;text-align:center}
  .bet .q{background:#5a6496;padding:6px 12px}
  .bet .gb{background:#c83c3c;font-size:16px;padding:8px 20px}
  .cres{font-size:18px;padding:10px 8px}
  .sec{font-size:16px;font-weight:bold;color:#ffbe50;padding:10px 0 4px}
  .txt{font-size:14px;padding:2px 6px}
  .row{display:flex;align-items:center;gap:10px;background:#2c324c;border-radius:6px;padding:6px 10px;margin-bottom:4px;font-size:13px}
  .rl{flex:1;line-height:1.5}
  .rb{background:#4678dc;width:86px;height:32px;font-size:14px}
  #invModal{background:rgba(0,0,0,.6)}
  #invBox{position:absolute;left:150px;top:30px;width:660px;height:540px;background:#202436;border:2px solid #667;border-radius:10px;display:flex;flex-direction:column}
  #invHead{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#2c3250;border-radius:8px 8px 0 0;font-weight:bold}
  #invHead button{background:#b34;padding:5px 14px}
  #invBody{flex:1;overflow-y:auto;padding:8px 10px}
  #invStatus{padding:6px 12px;background:#181b28;font-size:13px;font-weight:bold;color:#96ffc8;border-radius:0 0 8px 8px;min-height:18px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="960" height="600"></canvas>
  <div id="title" class="ov">
    <div class="box">
      <label for="nick">닉네임 :</label><input id="nick" maxlength="8" value="휠체어맨" autocomplete="off"><button id="startBtn">START</button>
      <div id="hint">닉네임을 정하고 START를 누르세요 (최대 8글자)</div>
      <button id="delBtn" style="display:none">저장 데이터 삭제</button>
    </div>
  </div>
  <button id="skipStory">스토리 스킵 ▶▶</button>
  <div id="mob">
    <div id="joy"><div id="knob"></div></div>
    <button id="mAtk">공격</button><button id="mE">E<br>스킬/입장</button><button id="mR">R<br>스킬</button><button id="mF">F<br>악마</button><button id="mQ">Q</button>
    <div id="mrow"><button id="m1">1<br>회복</button><button id="m2">2<br>행운</button><button id="m3">3<br>힘</button><button id="mI">인벤</button><button id="mP">일시<br>정지</button><button id="mT">이동</button></div>
  </div>
  <button id="codeBtn">🔑 코드 입력</button>
  <div id="codeModal" class="ov">
    <div id="codeBox">
      <h3 style="margin:0 0 6px">🔑 코드 입력</h3>
      <input id="codeIn" type="text" autocomplete="off" placeholder="코드를 입력하세요">
      <div><button id="codeOk">확인</button> <button id="codeClose" style="background:#555">닫기</button></div>
      <div id="codeMsg" style="margin-top:8px;font-size:13px;min-height:18px"></div>
    </div>
  </div>
  <button id="bakBtn">💾 세이브 백업/복원</button>
  <div id="bakModal" class="ov">
    <div id="bakBox">
      <h3>💾 세이브 백업 / 복원</h3>
      <p>캔바처럼 파일을 다시 올릴 때마다 저장 데이터가 사라지는 환경에서는, <b>업데이트하기 전에 백업 코드를 복사(또는 파일로 저장)</b>해 두고 새 버전에서 <b>복원</b>하세요.</p>
      <textarea id="bakText" spellcheck="false" placeholder="여기에 백업 코드가 표시됩니다. 복원할 땐 이 칸에 코드를 붙여넣고 [코드로 복원]을 누르세요."></textarea>
      <div>
        <button id="bakExport">백업 코드 만들기</button>
        <button id="bakCopy">복사</button>
        <button id="bakDown">파일로 저장</button>
        <button id="bakImport" style="background:#a05a3c">코드로 복원</button>
        <button id="bakFileBtn" style="background:#a05a3c">파일로 복원</button>
        <input type="file" id="bakFile" accept=".txt,.json,.wcsave" style="display:none">
        <button id="bakClose" style="background:#555">닫기</button>
      </div>
      <div id="bakMsg"></div>
      <p>※ 닉네임별 저장칸이 모두 들어 있습니다. 복원 후 같은 닉네임으로 START하면 이어서 할 수 있어요.</p>
    </div>
  </div>
  <div id="town" class="ov">
    <div id="ttop"></div>
    <div id="tabs"></div>
    <div id="tbody"></div>
    <div id="tbot"><div id="tmsg"></div><button id="goBtn"></button><button id="exitBtn">나가기 (Esc)</button></div>
  </div>
  <div id="invModal" class="ov">
    <div id="invBox">
      <div id="invHead"><span>인벤토리 (I / ESC로 닫기)</span><button id="invClose">닫기</button></div>
      <div id="invBody"></div>
      <div id="invStatus"></div>
    </div>
  </div>
</div>

<div id="rot">📱 화면을 가로로 돌려 주세요<br>(가로 모드에서 플레이할 수 있어요)</div>
<script>
"use strict";
// ============================================================ 기본
const W=960,H=600,AX=30,AY=175,AW=900,AH=390,PR=20,RANGE=95,FINAL=15;
try{document.fonts.load('bold 16px "Noto Sans KR"');document.fonts.load('16px "Noto Sans KR"');}catch(e){}
const FONT='"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR",sans-serif';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const wrap=document.getElementById('wrap');
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=x=>{x=clamp(x,0,1);return x*x*(3-2*x)};
function josa(n,a,b){if(!n)return b;const c=n.charCodeAt(n.length-1);if(c>=0xAC00&&c<=0xD7A3)return((c-0xAC00)%28!==0)?a:b;return b;}
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);wrap.style.transform='scale('+s+')';wrap.style.left=((innerWidth-W*s)/2)+'px';wrap.style.top=((innerHeight-H*s)/2)+'px';}
addEventListener('resize',fit);fit();

const GR={BASIC:{label:'기본',color:'#b9b9b9',o:0},RARE:{label:'희귀',color:'#5ad26e',o:1},EPIC:{label:'레어',color:'#5a96ff',o:2},LEGEND:{label:'전설',color:'#ffa528',o:3}};
const GRADES=['BASIC','RARE','EPIC','LEGEND'];

// ============================================================ 아이템 데이터
const mk=(name,type,grade,price,o)=>Object.assign({name,type,grade,price,atk:0,def:0,plus:0,hpBonus:0,shotDmg:0,critDmg:0,crit:0,kill:0,speedBonus:0,shotCd:0,skill:null,reach:0,atkCd:0,negate:0,desc:''},o||{});
// ---- 신규 전설 무기 11종 (모든 R 스킬 쿨타임 20초)
const NEWW={
  dusk:{n:'황혼의 심판자',atk:9,reach:90,atkCd:.45,desc:'패시브 처형자의 표식: 적을 3회 타격할 때마다 표식을 남기고, 표식이 새겨진 적에게 주는 피해 +15% | R 종말의 일격: 전방으로 돌진하며 경로상의 모든 적을 벰, 처치 성공 시 R 쿨타임 초기화 (쿨타임 20초)'}};
NEWW.undead={n:'언데드 낫',atk:11,reach:100,atkCd:.5,desc:'공격 시 5% 확률로 출혈 | 적을 처치하면 30% 확률로 영혼 흡수 (일반 일진: 일반 영혼 / 특수 일진: 70% 일반·30% 특수 영혼) | E 일반 영혼 소환: 95% 처치한 일진 부활(HP 1500) · 5% 특수 일진(사이버·총잡이·분조장, HP 2000) | R 특수 영혼 발동: 5% 보스(정크·퐁키·정키, HP 3000, 공격력 강화) · 95% 일반/특수 일진 소환 | 소환된 아군은 머리 위에 \'아군\' 표시'};
const WEAPONS={
  BASIC:[()=>mk('부캉이의 앞니','WEAPON','BASIC',20,{atk:5})],
  RARE:[()=>mk('푸바오의 대나무','WEAPON','RARE',80,{atk:7}),()=>mk('나무 도끼','WEAPON','RARE',90,{atk:5,crit:.10,critDmg:10}),
        ()=>mk('나무 검','WEAPON','RARE',70,{atk:5}),()=>mk('불타는 뉴비','WEAPON','RARE',60,{atk:4})],
  EPIC:[()=>mk('스머프의 도끼','WEAPON','EPIC',250,{atk:8}),
        ()=>mk('심판의 검','WEAPON','EPIC',300,{atk:8,skill:'judge',desc:'R키: 상대 한 명을 10초간 스턴 (쿨타임 20초) — 마우스에 가까운 적'}),
        ()=>mk('김씨 농부의 낫','WEAPON','EPIC',280,{atk:7,skill:'farmer',desc:'E키: 돌진 (쿨타임 10초) | R키: 모든 방향으로 돌 투척, 맞으면 30 데미지 (쿨타임 20초)'})],
  LEGEND:[()=>mk('어둠의 낫','WEAPON','LEGEND',900,{atk:7,kill:.01}),
          ()=>mk('무하한','WEAPON','LEGEND',1100,{atk:25,skill:'fist',reach:70,negate:.10,desc:'무기가 아닌 주먹 (리치 살짝 짧음) | R키: 모든 적 5초 스턴 (쿨타임 30초) | 10% 확률로 적의 공격 무효'}),
          ...Object.keys(NEWW).map(k=>()=>mk(NEWW[k].n,'WEAPON','LEGEND',1300,{atk:NEWW[k].atk,skill:k,reach:NEWW[k].reach,atkCd:NEWW[k].atkCd,desc:NEWW[k].desc})),
          ()=>mk('철퇴','WEAPON','LEGEND',1250,{atk:8,skill:'mace',desc:'공격키(Space)를 꾹 누르면 최대 7초까지 차징(철퇴 회전), 떼면 가장 가까운 적에게 철퇴를 던진다 (오래 차징할수록 강함) | R키: 철퇴를 휘둘러 모든 방향으로 잔해 발사, 맞으면 200 데미지 (쿨타임 15초)'}),
          ()=>mk('AK47','WEAPON','LEGEND',1200,{atk:5,skill:'ak',atkCd:.1,desc:'총 — 단일 사격, 0.1초 뒤 바로 재사격 | R키: 모든 적에게 넉백탄 발사 (쿨타임 15초) | 사격마다 1% 확률로 스나이퍼탄(맞으면 즉사)'}),
          ()=>mk('카두세우스','WEAPON','LEGEND',1300,{atk:7,skill:'caduceus',desc:'5번 공격할 때마다 무기가 랜덤으로 바뀐다 (9종) | 낫: 피해 +30%·확정 크리티컬 | 대검·워해머·랜스: 피해 +15%·해당 속성 취약 | 바스타드 소드·메이스·레이피어: 피해 +5%·디버프 | 손도끼·스틸레토: 피해 증가 없음·키워드 획득'})]
};
const ARMORS={
  BASIC:[()=>mk('늑구 가죽 갑옷','ARMOR','BASIC',20,{def:5})],
  RARE:[],
  EPIC:[()=>mk('푸바오 털 장갑','ARMOR','EPIC',250,{def:7})],
  LEGEND:[()=>mk('누군가의 불타는 목장갑','ARMOR','LEGEND',900,{def:10})]
};
const NEWM={BASIC:['구리','흑연','납','크롬철석','망카 광석'],RARE:['티타늄','타이타늄','강철','보크사이트','주석'],EPIC:['석영','사파이어','텅스텐','리튬','니켈','코발트'],LEGEND:['희토류','자수정','오팔','루비']};
const MATS={BASIC:['돌','석탄'].concat(NEWM.BASIC),RARE:['골드','철'].concat(NEWM.RARE),EPIC:['청금석','다이아몬드'].concat(NEWM.EPIC),LEGEND:['에메랄드','네더라이트'].concat(NEWM.LEGEND)};
const pickMat=gr=>MATS[gr][rnd(MATS[gr].length)];
const pickNew=gr=>NEWM[gr][rnd(NEWM[gr].length)];
const ORE_FOR={BASIC:'돌',RARE:'철',EPIC:'청금석',LEGEND:'에메랄드'};

const pAtk=()=>(P.weapon?totalAtk(P.weapon):2)+(P.level-1)+(P.powerTime>0?10:0)+(P.wheelPart?P.wheelPart.atk:0);

const addPotion=(i,n)=>{const before=P.potions[i];P.potions[i]=Math.min(i===1?LUCK_MAX:1e9,before+(n||1));return P.potions[i]>before;};
const mat=n=>P.mats[n]||0;
const addMat=(n,q)=>{P.mats[n]=mat(n)+q;};
function canPay(cost,coin){if(P.coins<coin)return false;for(const k in cost)if(mat(k)<cost[k])return false;return true;}
function pay(cost,coin){P.coins-=coin;for(const k in cost)P.mats[k]=mat(k)-cost[k];}

}
function allEquip(){const l=[];[P.weapon,P.armor,P.wheelWeapon,P.wheelPart].forEach(i=>{if(i)l.push(i);});return l.concat(P.bag);}
const isEquipped=i=>i===P.weapon||i===P.armor||i===P.wheelWeapon||i===P.wheelPart;

function equip(it){
  const bi=P.bag.indexOf(it);if(bi>=0)P.bag.splice(bi,1);
  const slot={WEAPON:'weapon',ARMOR:'armor',WHEEL_WEAPON:'wheelWeapon',WHEEL_PART:'wheelPart'}[it.type];
  if(P[slot])P.bag.push(P[slot]);P[slot]=it;P.hp=Math.min(P.hp,maxHp());
}
function usePotion(i){
  if(P.potions[i]<=0)return '포션이 없다!';
  if(g&&g.alt==='inf'&&g.inf){
    if(i===1)return '무한 모드에서는 행운포션을 쓸 수 없다!';
    g.inf.pu=g.inf.pu||[0,0,0];
    if(g.inf.pu[i]>=INF_POT_MAX)return '무한 모드에서는 이 포션을 최대 '+INF_POT_MAX+'개까지만 쓸 수 있다!';
    g.inf.pu[i]++;
  }
  P.potions[i]--;
  if(i===0){const h=Math.max(50,Math.floor(maxHp()*2/5));P.hp=Math.min(maxHp(),P.hp+h);return '회복포션! HP +'+h;}
  if(i===1){P.luckActive=true;return '행운포션! 다음 스테이지 보상 등급 UP';}
  P.powerTime=45;return '힘포션! 45초간 공격력 +10';
}

function ln(x1,y1,x2,y2,w,c){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function circ(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function rrect(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.stroke();}}
function txt(s,x,y,size,color,bold,align){ctx.font=(bold===false?'':'bold ')+size+'px '+FONT;ctx.fillStyle=color;ctx.textAlign=align||'left';ctx.fillText(s,x,y);ctx.textAlign='left';}
function wrapText(s,x,y,maxW,lh){
  const words=s.split(' ');let line='';
  for(const w of words){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){ctx.fillText(line,x,y);y+=lh;line=w;}else line=t;}
  if(line)ctx.fillText(line,x,y);
}

  else{ln(0,-58,-11,0,10,pants);ln(0,-58,12,0,10,pants);}
  rrect(-15,-106,30,52,12,shirt);
  if(pose===2){ln(0,-98,-14,-72,8,skin);ln(0,-98,46,-100,8,skin);circ(49,-100,7,skin);}
  else if(pose===1){ln(0,-98,-18,-86,8,skin);ln(0,-98,22,-112,8,skin);}
  else{ln(0,-98,-16,-70,8,skin);ln(0,-98,16,-70,8,skin);}

}

function cyberAI(e,dt,dx,dy,d,sp){

  else if(d<want-100){e.x-=ux*sp*dt;e.y-=uy*sp*dt;}
  else{e.x+=-uy*e.dir*sp*.4*dt;e.y+=ux*e.dir*sp*.4*dt;}

}
function gunAI(e,dt,dx,dy,d,sp){   // 거리를 유지하며 AK47을 4연발씩 쏜다
  e.aim=Math.atan2(dy,dx);e.gunCd-=dt;

function makeEnemy(s,boss){

  const e={x:0,y:0,kx:0,ky:0,speed:Math.min(150,70+4*s),r:18,hitFlash:0,atkAnim:0,atkCd:.6,dashT:0,dashCd:2.5,dmg:Math.floor(4+1.3*s),boss:false,dummy:false,name:names[idx],shirt:cols[idx],hair:'hsl('+rnd(360)+',50%,40%)'};
  e.maxHp=e.hp=Math.floor(24+14*s+.6*s*s);
  if(boss){
    const bn=['일진 대장 강태','그림자 파이터 블랙','철권왕 마스터 K'];
    e.boss=true;e.name=bn[(Math.floor(s/5)-1)%3]+(s>FINAL?' II':'');
    e.maxHp=e.hp=e.maxHp*8;e.dmg=Math.floor(e.dmg*1.6);e.speed=105;e.r=30;e.shirt='#9620a0';e.hair='#f0f0f0';
  }else{
    e.s=s;
    if(s>15){e.dashy=true;e.canCombo=true;e.dashCd=4+rnd(7);}          // 스테이지 15 초과: 가끔 돌진 / 연타
    const batOK=g.mine?g.mineFloor>=10:s>=20;                         // 방망이 일진: 스테이지 20 이상 (광산은 10층부터), 아주 가끔
    if(batOK&&Math.random()<.02){e.bat=true;e.name='방망이 일진';e.dmg=Math.floor(e.dmg*1.6);e.reach=14;e.r=19;e.shirt='#7a2020';}
  }

    else{e.x=AX+20+rnd(AW-40);e.y=Math.random()<.5?AY+20:AY+AH-20;}

function ftext(x,y,s,c,size){g.texts.push({x,y,s,c,size,life:.9});}
function nearest(max){let best=null,bd=max;for(const e of g.enemies){const d=Math.hypot(e.x-g.px,e.y-g.py);if(d<bd){bd=d;best=e;}}return best;}

// ---- 타격 처리 (근접 공격 / 돌진 / 총알 공통): 무기 특성 + 보스전 패시브 적용
// ---- 카두세우스: 5번 공격할 때마다 랜덤으로 무기(9종)가 바뀜
const CAD_ATTR={slash:'참격',blunt:'타격',pierce:'관통'};
const CAD=[
  {n:'낫',attr:'slash',t:'best',c:'#ff4060',d:'피해 +30% · 확정 크리티컬'},
  {n:'대검',attr:'slash',t:'mid',c:'#ffa040',d:'피해 +15% · 참격 취약 부여'},
  {n:'워해머',attr:'blunt',t:'mid',c:'#ffa040',d:'피해 +15% · 타격 취약 부여'},
  {n:'랜스',attr:'pierce',t:'mid',c:'#ffa040',d:'피해 +15% · 관통 취약 부여'},
  {n:'바스타드 소드',attr:'slash',t:'low',debuff:'bleed',c:'#9ad0ff',d:'피해 +5% · 출혈'},
  {n:'메이스',attr:'blunt',t:'low',debuff:'slow',c:'#9ad0ff',d:'피해 +5% · 둔화'},
  {n:'레이피어',attr:'pierce',t:'low',debuff:'weak',c:'#9ad0ff',d:'피해 +5% · 약화(공격력 감소)'},
  {n:'손도끼',attr:'blunt',t:'none',c:'#c8c8c8',d:'피해 증가 없음 · 키워드 획득'},
  {n:'스틸레토',attr:'pierce',t:'none',c:'#c8c8c8',d:'피해 증가 없음 · 키워드 획득'}];
function cadState(){if(!g.cad)g.cad={n:0,i:rnd(CAD.length)};return g.cad;}
function cadBegin(){const c=cadState();c.n++;g.cm=CAD[c.i];return g.cm;}
function cadEnd(){const c=cadState();if(c.n>=5){c.n=0;let j;do{j=rnd(CAD.length);}while(j===c.i);c.i=j;ftext(g.px,g.py-80,'무기 변경: '+CAD[j].n+' ('+CAD_ATTR[CAD[j].attr]+')','#ffe080',20);}}
function cadHit(e,dmg,tag,c){
  const m=g.cm;if(!m)return {dmg,tag,c};
  const mul=m.t==='best'?1.3:m.t==='mid'?1.15:m.t==='low'?1.05:1;
  dmg=Math.max(1,Math.round(dmg*mul));
  if(m.t==='best'){dmg=Math.round(dmg*1.5);tag='크리티컬!';c='#ffbe28';}   // 확정 크리티컬 = 1.5배
  e.vuln=e.vuln||{};
  if(e.vuln[m.attr]>0){dmg=Math.round(dmg*1.25);tag=(tag?tag+' ':'')+'취약!';c='#ff80ff';}
  if(m.t==='mid'){e.vuln[m.attr]=6;ftext(e.x,e.y-76,CAD_ATTR[m.attr]+' 취약','#ffb060',14);}
  else if(m.t==='low'){
    if(m.debuff==='bleed'){e.bleed={t:4,acc:0,dps:Math.max(1,Math.round(pAtk()*.25))};ftext(e.x,e.y-76,'출혈','#ff4040',14);}
    else if(m.debuff==='slow'){e.slow=3;e.slowF=.55;ftext(e.x,e.y-76,'둔화','#80c0ff',14);}
    else{e.weakT=4;ftext(e.x,e.y-76,'약화','#c0a0ff',14);}
  }else if(m.t==='none'){g.kw=(g.kw||0)+1;ftext(e.x,e.y-76,'키워드 +1','#ffe080',14);}
  return {dmg,tag,c};
}
function hitEnemy(e,base,cx,cy){
  const w=P.weapon;let dmg=base,tag=null,c='#fff';
  if(w){
    if(w.kill>0&&Math.random()<w.kill){dmg=e.boss?Math.max(dmg,Math.floor(e.maxHp*.25)):e.hp;tag='즉사!';c='#ff50ff';}
    else if(w.crit>0&&Math.random()<w.crit){dmg=dmg+(w.critDmg-w.atk);tag='크리티컬!';c='#ffbe28';}
  }
  if(w&&w.skill==='caduceus'){const r=cadHit(e,dmg,tag,c);dmg=r.dmg;tag=r.tag;c=r.c;}
  let fixedHit=false;
  if(w&&NEWW[w.skill]){const r=wpHit(e,dmg,tag,c,w);dmg=r.dmg;tag=r.tag;c=r.c;fixedHit=r.fixed;}
  if(e.dummy)g.dummyHits++;
  if(g.demonOn)dmg*=2;
  if(g.mode==='STAGE'&&g.passives.length){
    if(hasP('stun')&&e.stun>0)dmg=Math.max(1,Math.ceil(dmg/2));
    if(hasP('crit')&&Math.random()<.10){dmg+=20;tag='크리티컬!';c='#ffbe28';}
    if(hasP('fire')&&Math.random()<.10){e.burn={t:5,acc:0};ftext(e.x,e.y-70,'화염!','#ff8030',18);}
    if(hasP('stun')&&Math.random()<.05){e.stun=10;ftext(e.x,e.y-70,'스턴!','#8cf',18);}
  }
  e.kx+=cx*260;e.ky+=cy*260;
  damage(e,dmg,tag,c,fixedHit);
}
function doAttack(){
  const w=P.weapon;
  if(w&&w.skill==='ak'){shootAK();return;}
  g.attackCd=(w&&w.atkCd)||.45;g.swingT=.18;g.lastCombat=g.clock;
  if(w&&w.skill==='caduceus')cadBegin();
  const rg=(w&&w.reach)||RANGE,cx=Math.cos(g.aim),cy=Math.sin(g.aim);
  for(const e of g.enemies.slice()){
    const ex=e.x-g.px,ey=e.y-g.py,d=Math.hypot(ex,ey);
    if(d>rg+e.r)continue;
    const dot=d<1?1:(ex*cx+ey*cy)/d;
    if(d>40&&dot<.25)continue;
    hitEnemy(e,pAtk(),cx,cy);
  }
  if(w&&w.skill==='caduceus')cadEnd();
}
// ---- 무기 스킬 (E / R)
const wSkill=()=>(P&&P.weapon&&P.weapon.skill)||null;
const hasRSkill=()=>{const k=wSkill();return !!k&&k!=='caduceus';};                       // 4종 모두 R 스킬 보유
const demonKey=()=>hasRSkill()?'F':'R';                // R 스킬 무기를 들면 악마의 속삭임은 F키
const cdTxt=c=>c>0?Math.ceil(c)+'s':'준비됨';
function shootAK(){
  g.attackCd=.1;g.lastCombat=g.clock;g.akFlash=.06;
  const ca=Math.cos(g.aim),sa=Math.sin(g.aim);
  if(Math.random()<.01){ // 1% 스나이퍼: 맞으면 즉사 (보스는 최대 체력의 25%)
    g.projs.push({x:g.px,y:g.py-10,vx:ca*2400,vy:sa*2400,dmg:9999,life:.6,r:10,c:'#ff4040',sniper:true});
    ftext(g.px,g.py-60,'스나이퍼!','#ff5050',20);
  }else{
    // 방패병: AK47 사격마다 10% 확률로 (조준 방향 앞쪽에 있을 때) 총알을 튕겨낸다
    let sh=null;for(const e of g.enemies)if(e.shield){const a=Math.atan2(e.y-g.py,e.x-g.px);let df=Math.abs(a-g.aim);if(df>Math.PI)df=2*Math.PI-df;if(df<.6&&(!sh||Math.hypot(e.x-g.px,e.y-g.py)<Math.hypot(sh.x-g.px,sh.y-g.py)))sh=e;}
    if(sh&&Math.random()<.1){const a=Math.atan2(g.py-sh.y,g.px-sh.x);g.eps.push({x:sh.x,y:sh.y,vx:Math.cos(a)*900,vy:Math.sin(a)*900,dmg:10,fixed:true,life:1.4,c:'#9fd8ff'});sh.hitFlash=.12;ftext(sh.x,sh.y-60,'튕겨냄!','#9fd8ff',20);}
    else g.projs.push({x:g.px+ca*30,y:g.py-6+sa*30,vx:ca*1200,vy:sa*1200,dmg:pAtk(),life:.8,r:7,c:'#ffd24a',bullet:true});
  }
}
function nearestTo(x,y){let best=null,bd=1e9;for(const e of g.enemies){const d=Math.hypot(e.x-x,e.y-y);if(d<bd){bd=d;best=e;}}return best;}
function useWeaponR(){
  if((g.mode!=='STAGE'&&g.mode!=='VILLAGE')||g.pStun>0)return;
  const sk=wSkill();if(!sk||sk==='caduceus')return;
  if(sk==='undead'){summonSpecial();return;}
  if(g.cdR>0){ftext(g.px,g.py-50,'R 쿨타임 '+Math.ceil(g.cdR)+'s','#ccc',14);return;}
  if(!g.enemies.length)return;
  const m=g.demonOn?2:1;
  if(sk==='judge'){
    const t=nearestTo(g.mx,g.my);t.stun=10;g.cdR=20;ftext(t.x,t.y-80,'심판! 스턴 10초','#ffe060',20);
  }else if(sk==='farmer'){
    g.cdR=20;
    for(let i=0;i<16;i++){const a=i*Math.PI/8;g.projs.push({x:g.px,y:g.py-10,vx:Math.cos(a)*480,vy:Math.sin(a)*480,dmg:30*m,life:1.1,r:10,c:'#a0a0a0',stone:true});}
    ftext(g.px,g.py-70,'돌 투척!','#ddd',20);
  }else if(sk==='fist'){
    g.cdR=30;for(const e of g.enemies)e.stun=Math.max(e.stun||0,5);ftext(g.px,g.py-70,'전체 스턴 5초!','#8cf',22);
  }else if(WP_R[sk]){
    g.cdR=20;WP_R[sk](m);
  }else if(sk==='mace'){
    g.cdR=15;g.mSwing=.4;
    for(let i=0;i<20;i++){const a=i*Math.PI/10+(Math.random()-.5)*.12,sp=440+Math.random()*180;g.projs.push({x:g.px,y:g.py-10,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,dmg:200*m,life:1.1,r:10,c:'#b89060',stone:true,debris:true,tag:'잔해!'});}
    ftext(g.px,g.py-70,'철퇴 휘두르기! 잔해 폭발','#d8b070',20);
  }else if(sk==='ak'){
    g.cdR=15;
    for(const e of g.enemies){const a=Math.atan2(e.y-(g.py-10),e.x-g.px);g.projs.push({x:g.px,y:g.py-10,vx:Math.cos(a)*1100,vy:Math.sin(a)*1100,dmg:pAtk()*m,life:1.2,r:8,c:'#ffb040',kb:1500});}
    ftext(g.px,g.py-70,'넉백탄 발사!','#ffb040',20);
  }
  g.lastCombat=g.clock;
}

const WP_RN={dusk:'종말의 일격',undead:'특수 영혼 발동'};
const takenMul=e=>(e.mark?1.15:1)*(e.frozen>0?1.25:1)*(e.broken?1.25:1)*(e.venomT>0?1.25:1);
const healP=n=>{n=Math.round(n);if(n>0&&P.hp<maxHp()){const h=Math.min(n,maxHp()-P.hp);P.hp+=h;ftext(g.px,g.py-58,'+'+h,'#78ff9a',14);}if(g.ally&&n>0)g.ally.hp=Math.min(g.ally.maxHp,g.ally.hp+Math.round(g.ally.maxHp*.1));};
const addFx=o=>{(g.fx=g.fx||[]).push(o);};
const tgtList=()=>g.enemies.filter(e=>!e.q);
const nearestNQ=()=>{let b=null,bd=1e9;for(const e of tgtList()){const d=Math.hypot(e.x-g.px,e.y-g.py);if(d<bd){bd=d;b=e;}}return b;};
function wpHit(e,dmg,tag,c,w){   // 무기별 패시브 (기본 공격이 적중할 때)

// ---- 언데드 낫: 영혼 흡수 / 아군 소환
const ALLY_CAP=6,SP_KINDS=['gun','cyber','anger'];
function absorbSoul(e){
  if(e.boss||e.ally||Math.random()>=.3)return;
  const rec={name:e.sp?'일진':e.name,shirt:e.sp?'#96969f':e.shirt,hair:e.hair,bat:!e.sp&&!!e.bat,s:e.s||g.curStage,dmg:e.dmg,sp:e.sp||null};
  if(e.sp&&Math.random()>=.7){g.ss.push(rec);ftext(e.x,e.y-90,'특수 영혼 흡수!','#ff80ff',20);}
  else{g.souls.push(rec);ftext(e.x,e.y-90,'영혼 흡수!','#a0e8ff',18);}
}
function allyBase(){const s=g.alt==='inf'?30+2*(P.level||1):g.curStage||1;return s;}
function toAlly(e,hp,dmgMul){
  e.ally=true;e.maxHp=e.hp=hp;e.dmg=Math.max(1,Math.floor(e.dmg*dmgMul));e.atkCd=.5;e.hitFlash=0;e.dashy=false;e.canCombo=false;e.aCd=0;e.dir=Math.random()<.5?1:-1;
  e.x=g.px+(Math.random()<.5?-1:1)*(50+rnd(30));e.y=g.py+rnd(40)-20;e.gunCd=.8;e.burst=0;e.burstT=0;e.aim=0;
  if(e.sp==='anger')e.speed=Math.max(e.speed,150);
  g.allies.push(e);ftext(e.x,e.y-90,'소환!','#80ffb0',20);return e;
}
function summonSp(kind,hp){const e=makeSpecial(allyBase(),kind);return toAlly(e,hp,1.5);}
function summonNormal(){
  if(g.mode!=='STAGE'||g.guest||g.pStun>0||wSkill()!=='undead')return;
  if(g.cdE>0){ftext(g.px,g.py-50,'E 쿨타임 '+Math.ceil(g.cdE)+'s','#ccc',14);return;}
  if(!g.souls.length){ftext(g.px,g.py-50,'일반 영혼이 없다','#ccc',14);return;}
  if(g.allies.length>=ALLY_CAP){ftext(g.px,g.py-50,'아군은 최대 '+ALLY_CAP+'명','#ccc',14);return;}
  const r=g.souls.shift();g.cdE=1.5;g.lastCombat=g.clock;
  if(Math.random()<.05)summonSp(SP_KINDS[rnd(3)],2000);
  else{const e=makeEnemy(r.s,false);e.name=r.name;e.shirt=r.shirt;e.hair=r.hair;e.bat=r.bat;e.dmg=r.dmg;e.dashy=false;if(e.bat)e.reach=14;toAlly(e,1500,1.5);}
}
function summonSpecial(){
  if(g.mode!=='STAGE'||g.guest||g.pStun>0)return;
  if(g.cdR>0){ftext(g.px,g.py-50,'R 쿨타임 '+Math.ceil(g.cdR)+'s','#ccc',14);return;}
  if(!g.ss.length){ftext(g.px,g.py-50,'특수 영혼이 없다','#ccc',14);return;}
  if(g.allies.length>=ALLY_CAP){ftext(g.px,g.py-50,'아군은 최대 '+ALLY_CAP+'명','#ccc',14);return;}
  g.ss.shift();g.cdR=1.5;g.lastCombat=g.clock;
  if(Math.random()<.05){
    const i=rnd(3),p=[['정크','#d04030'],['정키','#3080d0'],['퐁키','#30b050']][i],e=makeEnemy(allyBase(),true);
    e.name=p[0];e.shirt=p[1];e.speed=118;if(i===2){e.bat=true;e.reach=22;}
    toAlly(e,3000,1.5*1.3);ftext(e.x,e.y-130,'보스 소환! '+p[0],'#ffd060',24);
  }else if(Math.random()<.5)summonSp(SP_KINDS[rnd(3)],2000);

function updateGame(dt){
  if(g.paused||g.userPaused)return;
  g.clock+=dt;
  if(g.attackCd>0)g.attackCd-=dt;if(g.swingT>0)g.swingT-=dt;if(g.akFlash>0)g.akFlash-=dt;if(g.invuln>0)g.invuln-=dt;if(P.powerTime>0)P.powerTime-=dt;
  g.texts=g.texts.filter(f=>{f.life-=dt;f.y-=40*dt;return f.life>0;});
  if(g.mode==='CLEAR'||g.mode==='DEAD'||g.mode==='PICK')return;
  if(g.mode==='CUT'){updateCut(dt);return;}
  if(g.pStun>0)g.pStun-=dt;
  const stunned=g.pStun>0;
  if(g.qCd>0)g.qCd-=dt;
  if(g.cdE>0)g.cdE-=dt;if(g.cdR>0)g.cdR-=dt;
  if(g.dash){ // 김씨 농부의 낫 E: 돌진 (지나간 적에게 타격)
    const d=g.dash;d.t-=dt;g.px+=d.vx*dt;g.py+=d.vy*dt;g.wheelRot+=dt*40;
    fixPlayer();
    const dc=Math.cos(g.aim),ds=Math.sin(g.aim);
    for(const e of g.enemies.slice()){
      if(d.hit.has(e))continue;
      if(Math.hypot(e.x-g.px,e.y-g.py)<e.r+PR+10){d.hit.add(e);hitEnemy(e,pAtk()*(d.mul||1),dc,ds);}
    }
    if(d.t<=0)g.dash=null;
  }
  const k=(stunned||g.dash||g.spec)?{}:g.keys;let dx=0,dy=0;
  if(k.KeyA||k.ArrowLeft)dx--;if(k.KeyD||k.ArrowRight)dx++;if(k.KeyW||k.ArrowUp)dy--;if(k.KeyS||k.ArrowDown)dy++;
  if(!dx&&!dy&&MOB.mag>.2&&!stunned&&!g.dash&&!g.spec){dx=MOB.jx;dy=MOB.jy;}
  if(dx||dy){const l=Math.hypot(dx,dy),sp=pSpeed()*dt;g.px+=dx/l*sp;g.py+=dy/l*sp;g.wheelRot+=sp/26;g.movedDist+=sp;}
  fixPlayer();
  if(g.mode==='VILLAGE')updateCam();
  if(MOB.on){const t=nearestTo(g.px,g.py);if(t&&Math.hypot(t.x-g.px,t.y-g.py)<900){g.sx=t.x-cam.x;g.sy=t.y-cam.y;}else if(MOB.mag>.2){g.sx=g.px+MOB.jx*200-cam.x;g.sy=g.py+MOB.jy*200-cam.y;}}   // 모바일: 가장 가까운 적 자동 조준
  g.mx=g.sx+cam.x;g.my=g.sy+cam.y;
  g.aim=Math.atan2(g.my-g.py,g.mx-g.px);
  if(wSkill()==='mace')maceUpdate(dt,!!(g.mouseDown||k.Space||k.KeyJ),stunned||!!g.dash||(g.mode!=='STAGE'&&g.mode!=='VILLAGE'));
  else{g.mc=0;if(!stunned&&!g.dash&&!g.spec&&(g.mouseDown||k.Space||k.KeyJ)&&g.attackCd<=0)doAttack();}
  if(g.mSwing>0)g.mSwing-=dt;
  if(g.guest)guestUpdate(dt);else updateEnemies(dt);
  if(g.mode==='CUT')return;
  updateEps(dt);
  updateAllies(dt);wpUpdate(dt);
  updatePassives(dt);
  if(P.wheelWeapon){
    g.subCd-=dt;
    if(g.subCd<=0){
      const t=nearest(460);
      if(t){const a=Math.atan2(t.y-g.py,t.x-g.px);g.projs.push({x:g.px,y:g.py-10,vx:Math.cos(a)*560,vy:Math.sin(a)*560,dmg:(P.wheelWeapon.shotDmg+P.level)*(g.demonOn?2:1),life:1.3,c:GR[P.wheelWeapon.grade].color});g.subCd=P.wheelWeapon.shotCd;}
    }
  }
  g.projs=g.projs.filter(pr=>{
    pr.life-=dt;
    if(pr.mace&&pr.tgt&&g.enemies.includes(pr.tgt)){const a=Math.atan2(pr.tgt.y-pr.y,pr.tgt.x-pr.x),sp=Math.hypot(pr.vx,pr.vy);pr.vx=Math.cos(a)*sp;pr.vy=Math.sin(a)*sp;}
    const n=Math.max(1,Math.ceil(Math.hypot(pr.vx,pr.vy)*dt/18));   // 빠른 탄환이 적을 통과하지 않도록 쪼개서 이동
    for(let s=0;s<n;s++){
      pr.x+=pr.vx*dt/n;pr.y+=pr.vy*dt/n;
      if(pr.chair){ // 던진 휠체어는 벽에 튕긴다
        if(pr.x<B.x0||pr.x>B.x1){pr.vx*=-1;pr.x=clamp(pr.x,B.x0,B.x1);}
        if(pr.y<B.y0||pr.y>B.y1){pr.vy*=-1;pr.y=clamp(pr.y,B.y0,B.y1);}
      }
      for(const e of g.enemies.slice())if(Math.hypot(e.x-pr.x,e.y-pr.y)<e.r+(pr.r||8)){projHit(pr,e);return false;}
    }
    return pr.life>0;
  });
  // 자동 회복: 3초간 공격/피격이 없으면 0.7초마다 HP +1
  g.regenActive=false;
  if(g.clock-g.lastCombat>=3&&P.hp<maxHp()&&!g.spec){
    g.regenActive=true;g.regenAcc+=dt;
    while(g.regenAcc>=.7){g.regenAcc-=.7;P.hp=Math.min(maxHp(),P.hp+1);ftext(g.px,g.py-40,'+1','#6eff8c',14);}
  }else g.regenAcc=0;
  if(g.mode==='STAGE'){
    if(g.queue.length&&g.waves&&g.waves.length){g.spawnTimer-=dt;if(g.spawnTimer<=0){const k=g.waves.shift();for(let i=0;i<k&&g.queue.length;i++)spawnEnemy(g.queue.shift());g.spawnTimer=15;}}   // 던전 5단계: 15초 간격으로 한 무리씩
    else if(g.queue.length){g.spawnTimer-=dt;if(g.spawnTimer<=0){spawnEnemy(g.queue.shift());g.spawnTimer=Math.max(.5,1.4-g.curStage*.05);}}
    if(g.alt==='inf'){if(g.guest){if(g.inf)g.inf.t+=dt;}else infUpdate(dt);}
    else if(!g.queue.length&&!g.enemies.length)onClear();
  }else if(g.mode==='VILLAGE'){
    updateVillage(dt);
  }else if(g.mode==='TUTORIAL'){
    if(g.tStep===0&&g.movedDist>250)g.tStep=1;
    else if(g.tStep===1&&g.dummyHits>=3)g.tStep=2;
    else if(g.tStep===2&&g.usedPotion)g.tStep=3;
    else if(g.tStep===3&&g.openedInv)g.tStep=4;
  }
}

function rollGrade(s,luck){
  let legend=1+s*.4,epic=8+s*1.2,rare=27+s*.5;

  const r=Math.random()*100;
  if(r<legend)return 'LEGEND';if(r<legend+epic)return 'EPIC';if(r<legend+epic+rare)return 'RARE';return 'BASIC';
}

// 원(중심 o.x, o.y+cy / 반지름 r)이 사각형 장애물과 겹치면 밀어낸다
function pushOut(o,cy,r){
  if(!B.obs)return;
  for(let pass=0;pass<2;pass++)for(const b of B.obs){
    const px=o.x,py=o.y+cy,nx=clamp(px,b.x,b.x+b.w),ny=clamp(py,b.y,b.y+b.h),dx=px-nx,dy=py-ny,d=Math.hypot(dx,dy);
    if(d>=r)continue;
    if(d>.001){o.x+=dx/d*(r-d);o.y+=dy/d*(r-d);}
    else{
      const l=px-b.x,rr=b.x+b.w-px,t=py-b.y,bt=b.y+b.h-py,m=Math.min(l,rr,t,bt);
      if(m===l)o.x=b.x-r;else if(m===rr)o.x=b.x+b.w+r;else if(m===t)o.y=b.y-r-cy;else o.y=b.y+b.h+r-cy;
    }
  }
}

function drawGame(){
  const vill=g.mode==='VILLAGE'||(g.mode==='DEAD'&&g.deathFrom==='VILLAGE');
  ctx.save();ctx.translate(-Math.round(cam.x),-Math.round(cam.y));
  if(vill){drawGround();drawVillageWorld();}
  else if(g.mode==='CUT'){drawBackground();drawCut();}
  else{
    drawBackground();
    const sorted=g.enemies.slice().sort((a,b)=>a.y-b.y);
    for(const e of sorted)if(e.y<=g.py)drawEnemy(e);
    if(!g.spec)drawPlayerSprite();
    for(const e of sorted)if(e.y>g.py)drawEnemy(e);
    drawAlly();drawAllies();
    drawEps();drawFx();
    if(g.alt==='inf'&&g.inf&&g.inf.co&&NET.partner&&!NET.partner.left)drawPartner();
    if(g.spec&&g.mode==='STAGE'){ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(W/2-170,H-70,340,36);txt('👁 관전 중 — '+(NET.partner?NET.partner.n:'')+' 님이 버티는 중',W/2,H-46,17,'#9fe8ff',true,'center');}
    {const n=g.enemies.filter(e=>e.smoke).length;if(n)drawSmoke(n);}
  }
  for(const pr of g.projs){
    if(pr.chair){pr.rot=(pr.rot||0)+.35;ctx.save();ctx.translate(pr.x,pr.y);ctx.rotate(pr.rot);ctx.translate(-pr.x,-pr.y);wheelchairMan(pr.x,pr.y+28,.5,P.wheelLevel,pr.rot,true,false);ctx.restore();}
    else if(pr.sniper)ln(pr.x-pr.vx*.05,pr.y-pr.vy*.05,pr.x,pr.y,5,'#ff4040');
    else if(pr.mace){pr.rot+=.4;maceSprite(pr.x,pr.y,pr.r,pr.rot);}
    else if(pr.bullet||pr.kb)ln(pr.x-pr.vx*.012,pr.y-pr.vy*.012,pr.x,pr.y,4,pr.c);
    else if(pr.stone){circ(pr.x,pr.y,pr.r,pr.debris?'#8a6a48':'#a0a0a0');circ(pr.x-3,pr.y-3,pr.r*.4,pr.debris?'#c8a070':'#d0d0d0');}
    else{circ(pr.x,pr.y,7,pr.c);circ(pr.x,pr.y,3,'#fff');}
  }
  for(const f of g.texts){const a=clamp(f.life/.4,0,1);ctx.globalAlpha=a;txt(f.s,f.x+1,f.y+1,f.size,'#000',true,'center');txt(f.s,f.x,f.y,f.size,f.c,true,'center');ctx.globalAlpha=1;}
  ctx.restore();
  if(vill)drawVillageHud();else drawHud();
  if(g.mode==='CUT')drawCutOverlay();
  if(g.mode==='STAGE'&&!g.userPaused){rrect(exitRect.x,exitRect.y,exitRect.w,exitRect.h,10,'rgba(60,64,96,.92)','#aab4e0');txt('나가기',exitRect.x+exitRect.w/2,exitRect.y+21,15,'#fff',true,'center');}
  if(g.mode==='TUTORIAL')drawTutorial();
  if(g.userPaused){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);txt('일시정지 (P)',W/2,H/2,40,'#fff',true,'center');}
  if(g.mode==='CLEAR')drawClear();
  if(g.mode==='DEAD')drawDead();
  if(g.mode==='PICK')drawPick();
  drawTitleToast();
}

const gradCss=g=>g.join(',');

function titleBadge(id,x,y,size){   // 캔버스: 알약 배경 + 그라데이션 글자 (x에서 시작, 폭 반환)
  const t=titleDef(id);if(!t)return 0;

function drawTitleToast(){

  const t=titleDef(titleToast.id);ctx.save();ctx.globalAlpha=Math.min(1,left/400);
  ctx.font='bold 26px '+FONT;const w=ctx.measureText(t.name).width,bw=Math.max(300,w+80);

const memLS={};   // localStorage를 못 쓰는 환경(샌드박스)에서 같은 세션 동안만 쓰는 임시 저장
function lsGet(k){try{const v=localStorage.getItem(k);if(v!==null)return v;}catch(e){}return k in memLS?memLS[k]:null;}
function lsSet(k,v){memLS[k]=v;try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
function lsDel(k){delete memLS[k];try{localStorage.removeItem(k);}catch(e){}}
function lsKeys(){const ks=new Set(Object.keys(memLS));try{for(let i=0;i<localStorage.length;i++)ks.add(localStorage.key(i));}catch(e){}return [...ks];}

function bakEncode(){
  try{if(P&&saveOk)saveGame();}catch(e){}
  const o={wc:1,saves:{},last:lsGet(SAVE_LAST)||''};
  for(const k of lsKeys())if(k.indexOf(SAVE_PREFIX)===0){const v=lsGet(k);if(v)o.saves[k]=v;}
  if(P&&saveOk)o.saves[SAVE_PREFIX+P.name]=JSON.stringify(curSaveData());
  if(P&&saveOk)o.last=P.name;
  return 'WCRPG1:'+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
}
function bakDecode(txt){
  txt=(txt||'').trim();if(txt.indexOf('WCRPG1:')!==0)throw new Error('백업 코드 형식이 아닙니다');
  const o=JSON.parse(decodeURIComponent(escape(atob(txt.slice(7).replace(/\s+/g,'')))));
  if(!o||o.wc!==1||!o.saves)throw new Error('백업 데이터가 올바르지 않습니다');
  return o;
}
function bakApply(o){
  let n=0;
  for(const k in o.saves){if(k.indexOf(SAVE_PREFIX)!==0)continue;try{const d=JSON.parse(o.saves[k]);if(!d||!d.P)continue;}catch(e){continue;}
    // 같은 닉네임 세이브가 이미 있으면 더 최근(t) 것을 유지
    const old=lsGet(k);let keep=false;if(old){try{keep=(JSON.parse(old).t||0)>(JSON.parse(o.saves[k]).t||0);}catch(e){}}
    if(!keep){lsSet(k,o.saves[k]);n++;}}
  if(o.last){lsSet(SAVE_LAST,o.last);const ni=$('nick');if(ni&&scene==='title')ni.value=o.last;}
  return n;
}

  function jmove(e){const r=joy.getBoundingClientRect(),R=r.width/2;let x=(e.clientX-(r.left+R))/R,y=(e.clientY-(r.top+R))/R;const l=Math.hypot(x,y);if(l>1){x/=l;y/=l;}
    MOB.jx=x;MOB.jy=y;MOB.mag=Math.min(1,l);knob.style.transform='translate('+x*42+'px,'+y*42+'px)';}
  function jend(){jid=null;MOB.jx=MOB.jy=MOB.mag=0;knob.style.transform='';}
  joy.addEventListener('pointerdown',e=>{e.preventDefault();jid=e.pointerId;try{joy.setPointerCapture(jid);}catch(_){}jmove(e);});
  joy.addEventListener('pointermove',e=>{if(e.pointerId===jid)jmove(e);});
  joy.addEventListener('pointerup',e=>{if(e.pointerId===jid)jend();});
  joy.addEventListener('pointercancel',jend);
  const key=code=>{dispatchEvent(new KeyboardEvent('keydown',{code}));dispatchEvent(new KeyboardEvent('keyup',{code}));};
  function tap(id,code){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('on');key(code);});['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>b.classList.remove('on')));}
  tap('mE','KeyE');tap('mR','KeyR');tap('mF','KeyF');tap('mQ','KeyQ');tap('m1','Digit1');tap('m2','Digit2');tap('m3','Digit3');tap('mI','KeyI');tap('mP','KeyP');tap('mT','KeyT');
  const a=$('mAtk');
  a.addEventListener('pointerdown',e=>{e.preventDefault();a.classList.add('on');if(g.mode==='CLEAR'){key('Enter');return;}g.mouseDown=true;});
  ['pointerup','pointercancel','pointerleave'].forEach(t=>a.addEventListener(t,()=>{a.classList.remove('on');g.mouseDown=false;}));
})();
function mobUpdate(){
  const rot=innerHeight>innerWidth&&MOB.on;if($('rot').style.display!==(rot?'flex':'none'))$('rot').style.display=rot?'flex':'none';
  const show=MOB.on&&scene==='game'&&g.mode!=='CUT'&&$('invModal').style.display!=='block'&&$('bakModal').style.display!=='block';
  if(MOB.vis!==show){MOB.vis=show;$('mob').style.display=show?'block':'none';if(!show){MOB.jx=MOB.jy=MOB.mag=0;$('knob').style.transform='';}}
  if(show)$('mT').style.display=g.mode==='VILLAGE'?'':'none';
}
// ---- 온라인 마을: 같은 서버에 접속한 다른 플레이어가 마을에서 보임 (공격/상호작용 없음)
//   서버 주소: 주소 뒤에 ?server=wss://서버주소 를 붙이거나, 아래 DEFAULT_SERVER 에 적어 두면 됨. 비어 있으면 오프라인(기존과 동일).
const DEFAULT_SERVER='';
const SERVER_URL=(()=>{try{const q=new URLSearchParams(location.search).get('server');if(q){lsSet('wcrpg_server',q);return q;}}catch(e){}return lsGet('wcrpg_server')||DEFAULT_SERVER;})();
const NET={q:null,partner:null,msg:'',ws:null,on:false,id:null,players:new Map(),retry:0,nextTry:0,sendT:0,last:null,away:true,count:0,lastMsg:0};
function netConnect(){
  if(!SERVER_URL||NET.ws||!P||performance.now()<NET.nextTry)return;
  let ws;try{ws=new WebSocket(SERVER_URL);}catch(e){NET.nextTry=performance.now()+10000;return;}
  NET.ws=ws;
  ws.onopen=()=>{NET.on=true;NET.retry=0;NET.last=null;ws.send(JSON.stringify({t:'join',n:P.name}));};
  ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data);}catch(e){return;}
    if(m.t==='welcome')NET.id=m.id;
    else if(m.t==='match'){if(NET.q!=='wait'||scene!=='town'){try{ws.send(JSON.stringify({t:'rend',tm:0}));}catch(e){}return;}NET.q='in';NET.partner={n:m.n,lv:m.lv,w:m.w,dv:m.dv,x:480,y:300,tx:480,ty:300,f:1,hp:0,tm:0,dead:0,ended:false,left:false,rot:0};
      if(scene==='town'){$('town').style.display='none';startInf(true,m.role);}}
    else if(m.t==='ppos'&&NET.partner){const r=NET.partner;r.tx=m.x;r.ty=m.y;r.f=m.f;r.hp=m.hp;r.tm=m.tm;r.dead=m.dead;if(r.dead&&scene==='game')coCheckOver();}
    else if(m.t==='rel'&&scene==='game')coRecv(m.d);
    else if(m.t==='pend'&&NET.partner){NET.partner.ended=true;NET.partner.dead=1;NET.partner.tm=m.tm;if(scene==='game'&&g.inf&&g.inf.co){if(g.host)coCheckOver();else coFinish();}}
    else if(m.t==='pleft'&&NET.partner){NET.partner.left=true;NET.partner.dead=1;if(scene==='game'&&g.inf&&g.inf.co){if(g.guest)coFinish();else coCheckOver();}}
    else if(m.t==='state'){NET.count=m.n||0;NET.lastMsg=performance.now();const seen=new Set();
      for(const q of m.p){seen.add(q.id);let r=NET.players.get(q.id);
        if(!r){r={id:q.id,x:q.x,y:q.y,rot:0};NET.players.set(q.id,r);}
        r.n=q.n;r.lv=q.lv;r.ti=q.ti;r.w=q.w;r.dv=q.dv;r.f=q.f;r.tx=q.x;r.ty=q.y;}
      for(const id of [...NET.players.keys()])if(!seen.has(id))NET.players.delete(id);}};
  const gone=()=>{if(NET.ws!==ws)return;NET.ws=null;NET.on=false;NET.id=null;NET.players.clear();NET.away=true;if(NET.q==='wait'){NET.q=null;NET.msg='서버 연결이 끊겼습니다.';}if(NET.partner)NET.partner.left=true;NET.retry++;NET.nextTry=performance.now()+Math.min(30000,1000*Math.pow(2,NET.retry));};
  ws.onclose=gone;ws.onerror=()=>{try{ws.close();}catch(e){}};
}
function netTick(dt){
  if(!SERVER_URL)return;
  const inV=scene==='town'||(scene==='game'&&g.mode==='VILLAGE');
  if(P&&saveOk)netConnect();
  const co=scene==='game'&&g.alt==='inf'&&g.inf&&g.inf.co&&NET.partner;
  if(co&&NET.on&&NET.ws&&NET.ws.readyState===1&&!g.inf.sentEnd){
    NET.sendT-=dt;if(NET.sendT<=0){NET.sendT=.1;NET.ws.send(JSON.stringify({t:'rpos',x:Math.round(g.px),y:Math.round(g.py),f:g.mx<g.px?0:1,hp:Math.round(P.hp),tm:g.inf.t,dead:(g.spec||g.mode==='DEAD')?1:0}));}
    if(g.host&&g.mode==='STAGE'&&!g.paused&&!g.userPaused){NET.snapT-=dt;if(NET.snapT<=0){NET.snapT=1/15;coSend(coSnapshot());}coFlush();}
    return netTail(dt);}
  netMain(dt,inV);return netTail(dt);
}
function netTail(dt){const r=NET.partner;if(r){const k=Math.min(1,dt*12),dx=r.tx-r.x,dy=r.ty-r.y;r.x+=dx*k;r.y+=dy*k;r.rot+=Math.hypot(dx,dy)*k/26;}}
function netMain(dt,inV){
  if(NET.on&&NET.ws&&NET.ws.readyState===1){
    NET.sendT-=dt;
    if(inV){
      if(NET.sendT<=0){NET.sendT=.1;const f=(scene==='game'&&g.mx<g.px)?0:1,
        cur=Math.round(g.px)+','+Math.round(g.py)+','+f+','+P.level+','+(P.titleEq||'')+','+P.wheelLevel+','+(P.devCode?1:0);
        if(cur!==NET.last||NET.sendT<=-1||!NET.hb||performance.now()-NET.hb>1000){NET.last=cur;NET.hb=performance.now();NET.ws.send(JSON.stringify({t:'pos',n:P.name,x:Math.round(g.px),y:Math.round(g.py),f,lv:P.level,ti:P.titleEq||'',w:P.wheelLevel,dv:P.devCode?1:0}));}}
      NET.away=false;
    }else if(!NET.away||performance.now()-(NET.hb||0)>3000){NET.away=true;NET.hb=performance.now();NET.ws.send(JSON.stringify({t:'away'}));}
  }
  for(const r of NET.players.values()){const dx=r.tx-r.x,dy=r.ty-r.y,k=Math.min(1,dt*12);r.x+=dx*k;r.y+=dy*k;r.rot+=Math.hypot(dx,dy)*k/26;}
}
function drawRemote(r){
  ctx.save();ctx.globalAlpha=.92;wheelchairMan(r.x,r.y+30,.62,r.w||0,r.rot,r.f===1,false,!!r.dv);ctx.restore();
  txt((r.n||'')+'  Lv.'+(r.lv||1),r.x,r.y-48,13,'#bfeaff',true,'center');
  if(r.ti){const t=titleDef(r.ti);if(t){ctx.font='bold 12px '+FONT;const w=ctx.measureText(t.name).width+16;titleBadge(r.ti,r.x-w/2,r.y-70,12);}}
}
function drawPartner(){
  const r=NET.partner;ctx.save();ctx.globalAlpha=r.dead?.35:.95;wheelchairMan(r.x,r.y+30,.62,r.w||0,r.rot,r.f===1,false,!!r.dv);ctx.restore();
  txt((r.n||'동료')+(r.dead?'  (쓰러짐)':''),r.x,r.y-48,13,'#9fe8ff',true,'center');
  if(!r.dead&&r.hp>0){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(r.x-22,r.y-42,44,5);ctx.fillStyle='#46d264';ctx.fillRect(r.x-21,r.y-41,42,3);}
}
function drawNetStatus(){
  if(!SERVER_URL)return;
  const ok=NET.on;circ(724,56,4,ok?'#46d264':'#e0a030');
  txt(ok?('온라인 · 마을 접속자 '+NET.count+'명'):'온라인 연결 중…',734,60,12,ok?'#9fe8b0':'#e0b060',false);
}
function mpos(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
cv.addEventListener('mousemove',e=>{const p=mpos(e);g.sx=p.x;g.sy=p.y;});
cv.addEventListener('mousedown',e=>{
  if(scene!=='game'||e.button!==0)return;
  const p=mpos(e);g.sx=p.x;g.sy=p.y;
  if(g.mode==='CUT')return;
  if(g.mode==='PICK'){for(let i=0;i<g.choices.length;i++)if(inRect(cardRect(i),p.x,p.y)){pickPassive(i);break;}return;}
  if(g.mode==='STAGE'&&inRect(exitRect,p.x,p.y)){exitStage();return;}
  if(g.mode==='VILLAGE'&&inRect(tpRect,p.x,p.y)){openTeleport();return;}
  if(g.mode==='CLEAR'&&inRect(btnRect,p.x,p.y)){leaveClear();return;}
  if(g.mode==='DEAD'&&inRect(btnRect,p.x,p.y)){leaveDead();return;}
  if(g.mode==='TUTORIAL'&&inRect(skipRect,p.x,p.y)){endTutorial();return;}
  if(g.mode==='TUTORIAL'&&g.tStep>=4&&p.x>150&&p.x<930&&p.y>470&&p.y<560){endTutorial();return;}
  if(MOB.on)return;   // 모바일: 화면 탭으로 공격하지 않음 (공격 버튼 사용)
  g.mouseDown=true;
});
addEventListener('mouseup',()=>{g.mouseDown=false;});
cv.addEventListener('contextmenu',e=>e.preventDefault());

let lastT=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  mobUpdate();
  netTick(dt);
  if(scene==='title')drawTitle();
  else if(scene==='story'){story.t+=dt;if(story.t>=STORY_TOTAL)endStory();else drawStory();}
  else if(scene==='game'){updateGame(dt);drawGame();}
  requestAnimationFrame(frame);
}
$('title').style.display='block';
requestAnimationFrame(frame);
</script>
